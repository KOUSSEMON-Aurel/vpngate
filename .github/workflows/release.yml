name: Release Desktop CLI

on:
  push:
    tags:
      - 'v*'
      - '!app-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release (laisser vide pour auto-détecter ou ex: v0.4.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Ensure Git Tag for Release
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            echo "Création du tag demandé : $TAG"
            git tag -a "$TAG" -m "Release $TAG"
          elif [ -z "$(git tag --points-at HEAD)" ]; then
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.4.1")
            echo "Pas de tag sur HEAD. Utilisation de $LATEST_TAG"
            git tag -a "$LATEST_TAG" -m "Release $LATEST_TAG" || true
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CGO_ENABLED: 0
