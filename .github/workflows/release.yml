name: Release Desktop CLI

on:
  push:
    tags:
      - 'v*'
      - '!app-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release (laisser vide pour auto-détecter ou ex: v0.4.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Ensure Git Tag for Release
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ -n "$(git tag --points-at HEAD)" ]; then
            TAG="$(git tag --points-at HEAD | head -n 1)"
          else
            TAG="v0.4.1"
          fi
          echo "Utilisation du tag : $TAG"
          git tag -f -a "$TAG" -m "Release $TAG"
          git push -f origin "$TAG" || true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CGO_ENABLED: 0
