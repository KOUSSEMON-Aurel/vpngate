name: Release Android

on:
  push:
    tags:
      - 'v*'
      - 'app-v*'
  workflow_dispatch:

jobs:
  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Release (APK & AAB)
        working-directory: ./android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Génération du keystore Android à partir des secrets GitHub..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/key.jks
            export ANDROID_STORE_FILE="key.jks"
          else
            echo "Aucun secret de keystore trouvé, compilation en mode release standard..."
          fi

          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_artifacts
          
          # Extraction de la version dans android/app/build.gradle.kts
          VERSION=$(grep 'versionName = ' android/app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode = ' android/app/build.gradle.kts | head -n 1 | sed -E 's/.*= *([0-9]+).*/\1/')
          
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          
          # Copie et renommage propre des APKs
          cd android/app/build/outputs/apk/release/
          for f in app-*.apk; do
            if [ -f "$f" ]; then
              arch=$(echo "$f" | sed -E 's/app-//;s/-release(-unsigned)?\.apk//')
              cp "$f" "../../../../../release_artifacts/openrelay_${VERSION}_${arch}.apk"
            fi
          done
          cd -

          # Copie et renommage du bundle Google Play AAB
          AAB_FILE=$(find android/app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          if [ -f "$AAB_FILE" ]; then
            cp "$AAB_FILE" "release_artifacts/openrelay_${VERSION}.aab"
          fi

          echo "Fichiers prêts pour la release :"
          ls -lh release_artifacts/

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: openrelay-android-v${{ env.VERSION }}
          path: release_artifacts/
          if-no-files-found: error

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ env.VERSION }}"
          VERSION_CODE="${{ env.VERSION_CODE }}"
          
          # Détermine le nom du tag
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="app-v${VERSION}"
          fi
          
          echo "Nom du tag : $TAG_NAME"

          cat <<EOF > release_notes.md
          ## OpenRelay VPN v${VERSION} (Build ${VERSION_CODE})

          ### Fichiers disponibles :
          - **Google Play Bundle**: \`openrelay_${VERSION}.aab\` (à importer dans la Google Play Console)
          - **APK Universel**: \`openrelay_${VERSION}_universal.apk\` (installation directe tout appareil)
          - **APKs par architecture**: \`arm64-v8a\`, \`armeabi-v7a\`, \`x86_64\`, \`x86\`
          EOF

          # Création de la release GitHub si elle n'existe pas encore
          if ! gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Création de la release GitHub $TAG_NAME..."
            gh release create "$TAG_NAME" \
              --title "OpenRelay VPN v${VERSION}" \
              --notes-file release_notes.md
          fi

          # Upload des artefacts avec --clobber pour remplacer en cas de re-run
          echo "Upload des fichiers sur la release $TAG_NAME..."
          gh release upload "$TAG_NAME" release_artifacts/* --clobber
